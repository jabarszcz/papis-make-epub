[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "papis-make-epub"
version = "0.1.0"
description = "Build EPUB renditions of papis documents"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Jean-Alexandre Barszcz", email = "jalex_b@hotmail.com" },
]
keywords = ["papis", "epub", "arxiv", "bibliography", "e-reader"]
# the floor and the classifiers track the flake's check matrix
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = [
    "papis>=0.14",
    "click>=7",
    "beautifulsoup4>=4.9",
    # a beautifulsoup4 dependency already, but imported directly
    "soupsieve",
    "lxml>=4.3",
    "ebooklib>=0.18",
    "pylatexenc>=2.10",
    "matplotlib>=3.5",
    # both are matplotlib dependencies already, but imported directly
    "fonttools>=4.22",
    "Pillow>=8",
]

[project.urls]
Repository = "https://github.com/jabarszcz/papis-make-epub"

[project.scripts]
# discovered by papis as the external command `papis make-epub` when
# on PATH; verb-qualified so the bare `epub` name stays free for other
# functionality in papis's flat command namespace
papis-make-epub = "papis_make_epub.cli:main"
# builds the renderer-comparison EPUB for judging the renderers on a
# device (one section per renderer, identical formulas)
papis-make-epub-demo = "papis_make_epub.math_rendering_demo:main"

[project.entry-points."papis.command"]
# used instead of the external script when installed in papis's own environment
make-epub = "papis_make_epub.cli:cli"

# PEP 735: local tooling
[dependency-groups]
dev = [
    # beautifulsoup4 ships its own types (py.typed) since 4.13, so no
    # stub package: one would take precedence over them
    "mypy>=1.0",
    "ruff",
    "pytest>=7",
    "pytest-cov",
    # golden/characterization tests of the source extractions
    "pytest-regressions>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["papis_make_epub"]

# tool configuration mirrors papis's own conventions

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle
    "F",   # pyflakes
    "G",   # flake8-logging-format
    "I",   # flake8-isort
    "N",   # pep8-naming
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "Q",   # flake8-quotes
    "RUF", # ruff
    "SLF", # flake8-self
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",   # pycodestyle
]
ignore = [
    # function-local imports are a deliberate pattern here (optional
    # tooling and expensive imports)
    "PLC0415", # import-outside-top-level
]

# The platform modules reach the page through the Node queries alone,
# which record the rules they apply (papis_make_epub/sources/node.py):
# they import no parser and no unwrapping of a node, and read no
# private attribute. Everywhere else, both checks are off.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"bs4".msg = "a platform module reaches the page through Node queries"
"soupsieve".msg = "a platform module reaches the page through Node queries"
"lxml".msg = "a platform module reaches the page through Node queries"
"papis_make_epub.sources.node.tag_of".msg = "a platform module reaches the page through Node queries"

[tool.ruff.lint.per-file-ignores]
"!papis_make_epub/sources/{acm,arxiv,ieee,sciencedirect,springer}.py" = ["SLF001", "TID251"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# source_pkgs measures papis_make_epub as the imported package (in
# the flake's checks that is the installed copy; a papis_make_epub
# directory in the working directory would otherwise take precedence
# as a path spec and match no imported file)
[tool.coverage.run]
source_pkgs = ["papis_make_epub"]

[tool.mypy]
strict = true
pretty = true
files = ["papis_make_epub", "tests", "tools"]
warn_unused_ignores = false

# verified untyped (no py.typed): ebooklib, fontTools, pylatexenc;
# matplotlib and papis ship py.typed and are checked for real
[[tool.mypy.overrides]]
module = [
    "ebooklib.*",
    "fontTools.*",
    "pylatexenc.*",
]
ignore_missing_imports = true
