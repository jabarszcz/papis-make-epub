abstract: "<jats:p>\n                    We present the first mechanized, succinct,
  practical, complete, and proven-faithful semantics for a modern regular expression
  language with backtracking semantics. We ensure its faithfulness by proving it equivalent
  to a preexisting line-by-line embedding of the official ECMAScript specification
  of JavaScript regular expressions. We demonstrate its practicality by presenting
  two real-world applications. First, a new notion of contextual equivalence for modern
  regular expressions, which we use to prove or disprove rewrites drawn from previous
  work. Second, the first formal proof of the PikeVM algorithm used in many real-world
  engines. In contrast with the specification and other formalization work, our semantics
  captures not only the top-priority match, but a full\n                    <jats:italic
  toggle=\"yes\">backtracking</jats:italic>\n                    tree recording all
  possible matches and their respective priority. All our definitions and results
  have been mechanized in the Rocq proof assistant.\n                  </jats:p>"
