# The fixture corpus, one entry per committed page, with its
# provenance. The tests parametrize over the entries (conftest.py);
# refresh.py reads the captures' procedure fields.
#
# kind       "capture": a whole page of an open-access CC BY paper
#            (license verified in the Crossref record's vor entry;
#            for arXiv, on the abs page), the page beside its
#            bibliographic record under library/<id>. Each is
#            redistributed under that license
#            (https://creativecommons.org/licenses/by/4.0/), the
#            attribution being the record and the modifications
#            being refresh.py's scrub.
#            "reduction": a page cut down to the parts that exercise
#            a form the captures do not, at reductions/<id>.html,
#            kept under fair use/dealing with the page's URL.
# captured   the date the page was captured; for a reduction, the
#            date of the capture it was reduced from.
# best_effort  the build option the goldens were pinned with (the
#            TeX-only sources carry a few formulas texmath cannot
#            express; best-effort keeps them verbatim).
#
# Capture procedure fields (refresh.py): python_fetch (an arXiv id
# fetched through the package's own path), manual (instructions
# for a page the scripted browser is not served), headed (the page
# loads in a visible window only), wait (settle time in ms for
# hydration, interstitials and the browser script's work),
# browser_script (a file beside this one,
# run in the page before it loads, for folds the capture must open),
# wait_until (when single-file considers the page loaded: load,
# networkIdle (its default), DOMContentLoaded, ...).
# refresh.py writes a capture's `captured` date when the capture
# validates; the field has to follow the entry's id.

[[fixture]]
id = "acm"
kind = "capture"
platform = "acm"
url = "https://dl.acm.org/doi/full/10.1145/3776710"
captured = 2026-10-14
best_effort = false
# dl.acm.org does not serve the page to the scripted browser
manual = "save the page from the browser ('Web Page, complete') as tests/fixtures/library/acm/acm.html"

[[fixture]]
id = "arxiv"
kind = "capture"
platform = "arxiv"
url = "https://arxiv.org/html/2312.00752"
captured = 2026-10-02
best_effort = false
# the route the arxiv source serves in real use
python_fetch = "2312.00752"

[[fixture]]
id = "ieee"
kind = "capture"
platform = "ieee"
url = "https://ieeexplore.ieee.org/document/8796365"
captured = 2026-10-02
best_effort = true
# ieeexplore.ieee.org serves the article in a visible window only
headed = true
# the References fold is closed until clicked and its list paginated;
# the folds are one accordion, one open at a time, so Footnotes stays
# closed (the source has no footnotes part)
browser_script = "ieee-expand-folds.js"
# the page's background traffic never goes idle
wait_until = "load"

